name: Release Zelda C64

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools (ACME, VICE, Python dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y acme vice
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Check build environment
        run: make check

      - name: Build Cartridge CRT and Maps
        run: |
          make
          make maps

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            build/zelda.crt
            build/map_overworld.png
            build/map_dungeon_*.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
